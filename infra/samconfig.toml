# samconfig.toml — defaults for local sam build / deploy.
# Override with CLI flags when needed. Do not put secrets here.

version = 0.1

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
stack_name = "kintore-memo-dev"
resolve_s3 = true
# Named IAM Role (ApiFunctionRole.RoleName) requires CAPABILITY_NAMED_IAM.
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
region = "ap-northeast-1"
confirm_changeset = true
fail_on_empty_changeset = false
parameter_overrides = "ProjectName=kintore-memo Environment=dev LogRetentionDays=14 ReservedConcurrency=0"

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.sync.parameters]
watch = true
