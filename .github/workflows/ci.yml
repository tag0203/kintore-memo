# CI always runs. It does not deploy and does not use AWS credentials.
# Deploy is .github/workflows/deploy.yml. A successful push to main deploys dev
# after this workflow. CI is the superset of test.yml, so deploy waits on CI only.
# Action versions are pinned to full commit SHAs (mutable tags are not trusted).

name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: test, typecheck, build, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test Go API
        env:
          GOTOOLCHAIN: local
        run: go test -C api ./...

      - name: Compile the Lambda binary for arm64
        env:
          GOTOOLCHAIN: local
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -C api -o /tmp/bootstrap .

      - name: Build
        run: npm run build

      # npm test checks the tree before dist/ exists. Scan the build output too.
      - name: Check secrets
        run: npm run check:secrets

  sam:
    name: sam validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAM_CLI_TELEMETRY: "0"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Detect SAM template
        id: sam
        run: |
          set -euo pipefail
          if [ -f infra/template.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "infra/template.yaml is absent. Skipping SAM."
          fi

      - name: Setup Node.js
        if: steps.sam.outputs.present == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        if: steps.sam.outputs.present == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum

      - name: Setup SAM CLI
        if: steps.sam.outputs.present == 'true'
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Install cfn-lint
        if: steps.sam.outputs.present == 'true'
        run: |
          set -euo pipefail
          CFN_LINT_VERSION=1.57.1
          if command -v pipx >/dev/null 2>&1; then
            pipx install "cfn-lint==${CFN_LINT_VERSION}"
          else
            python3 -m pip install --user "cfn-lint==${CFN_LINT_VERSION}"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate templates
        if: steps.sam.outputs.present == 'true'
        working-directory: infra
        run: |
          set -euo pipefail
          sam validate --lint --template template.yaml
          if [ -f github-oidc.yaml ]; then
            sam validate --lint --template github-oidc.yaml
          fi

      - name: Build API
        if: steps.sam.outputs.present == 'true'
        working-directory: infra
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          sam build --template template.yaml
