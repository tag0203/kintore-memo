# Go and npm tests. CI and OIDC deploy live in ci.yml and deploy.yml.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: api/go.sum
      - run: npm ci
      - run: npm test
      - run: go test -C api ./...
      - name: Compile the Lambda binary for arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -C api -o /tmp/bootstrap .
