# OIDC deploy. No long-lived AWS access keys.
# No-op (success) when the repository secret AWS_DEPLOY_ROLE_ARN is unset.
# Do not read that ARN from an Actions variable. The runner prints step env and
# action inputs before add-mask, and variables are not auto-masked, so a
# fallback would put the role ARN (and the AWS account ID) in the log.
# Do not add AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY.
# Do not use `set -x`, `sam deploy --debug`, or `aws --debug` — they can print credentials.
# This workflow does not read SSM parameters.
#
# Build (sam build / npm ci / npm run build) runs in jobs without AWS credentials or
# id-token: write. Only deploy-stack and publish-spa assume the OIDC role.
#
# Automatic deploy: after the CI workflow succeeds for a push to main, publish dev
# from that workflow's head SHA. Manual workflow_dispatch is unchanged (dev/staging/prod).
# workflow_run cannot filter paths. The gate skips when only docs or markdown
# changed since the last successful dev deployment.
# Pause automatic deploy with repository variable AUTO_DEPLOY_DEV=false.
# That does not disable workflow_dispatch.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: SAM environment
        type: choice
        required: true
        default: dev
        options:
          - dev
          - staging
          - prod
  workflow_run:
    # CI already runs the test workflow's checks plus typecheck, build, secrets, and SAM.
    # workflow_run fires when any listed workflow completes, so listing "test" as well
    # would deploy after only the subset succeeded.
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Job-level permissions only. Build jobs must not receive id-token: write.
permissions: {}

# Manual staging/prod keep their own groups. Automatic runs share deploy-dev
# with a manual dev deploy. In-progress deploys are not cancelled.
# GitHub keeps a single pending run in this group, so a later run replaces the
# pending one. The run that executes diffs the tested SHA against the last
# successful dev deployment, so a replaced run's application changes are still
# published. An older SHA is skipped when a newer application commit is already
# on main; that newer SHA is the one this group runs.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  gate:
    name: Check deploy role configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_dispatch evaluates the first clause and does not need workflow_run fields.
    # Automatic deploy requires this repo's CI workflow, from a push to main.
    # path may be `.github/workflows/ci.yml` or that file plus `@ref`
    # (the REST example is `.github/workflows/build.yml@main`). The shell
    # rejects any suffix other than main, refs/heads/main, or a 40-hex SHA.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.name == 'CI' &&
        github.event.workflow_run.workflow_id == 372805829 &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_repository.id == github.repository_id &&
        github.repository_id == 1389679197 &&
        (
          github.event.workflow_run.path == '.github/workflows/ci.yml' ||
          startsWith(github.event.workflow_run.path, '.github/workflows/ci.yml@')
        )
      )
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      configured: ${{ steps.gate.outputs.configured }}
      environment: ${{ steps.gate.outputs.environment }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Checkout main to inspect the tested commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # github.sha is the default-branch commit this workflow file came from.
          # fetch-depth: 0 is the history of that SHA, not commits pushed while
          # this run waited. A later fetch updates origin/main without swapping
          # the planner script.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Skip until the OIDC role exists
        id: gate
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AUTO_DEPLOY_DEV: ${{ vars.AUTO_DEPLOY_DEV }}
          INPUT_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || '' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_PATH: ${{ github.event.workflow_run.path }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_REPOSITORY_ID: ${{ github.event.workflow_run.head_repository.id }}
          REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skip() {
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "environment=" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "$1"
            exit 0
          }

          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            DECISION="$(node scripts/ci-workflow-run.mjs)" \
              || { echo "Could not validate the triggering workflow."; exit 1; }
            echo "CI workflow check: ${DECISION}"
            TRUSTED="$(node -e 'const decision=JSON.parse(process.argv[1]); if(decision.ok!==true&&decision.ok!==false) process.exit(2); process.stdout.write(decision.ok?"true":"false")' "${DECISION}")" \
              || { echo "Could not read the CI workflow check."; exit 1; }
            if [ "${TRUSTED}" != "true" ]; then
              echo "Refusing automatic deploy: triggering workflow is not a successful push of CI on main in this repository."
              exit 1
            fi
            case "${AUTO_DEPLOY_DEV:-}" in
              ""|true|TRUE|True) ;;
              false|FALSE|False)
                skip "AUTO_DEPLOY_DEV is false. Automatic dev deploy is paused. workflow_dispatch still works."
                ;;
              *)
                echo "AUTO_DEPLOY_DEV must be empty, true, or false."
                exit 1
                ;;
            esac
            if ! [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Refusing automatic deploy: workflow_run head_sha is not a commit SHA."
              exit 1
            fi
          elif [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "Refusing deploy: unsupported event."
            exit 1
          fi

          if [ -z "${AWS_DEPLOY_ROLE_ARN}" ]; then
            skip "AWS_DEPLOY_ROLE_ARN secret is unset. Deploy is a no-op until you create that Actions secret (Settings → Secrets and variables → Actions → Secrets) with the deploy role ARN, then delete the repository variable of the same name. A variable is not used: it would be printed in this env block. See docs/github-actions-oidc.md."
          fi
          if ! [[ "${AWS_DEPLOY_ROLE_ARN}" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+$ ]]; then
            echo "AWS_DEPLOY_ROLE_ARN is set but is not an IAM role ARN. Not assuming it."
            exit 1
          fi
          # workflow_run's GITHUB_REF is the default branch. The trust policy's sub
          # uses that ref, so it must stay refs/heads/main. The deployed tree is HEAD_SHA.
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "This workflow only assumes the deploy role from refs/heads/main."
            exit 1
          fi
          # The secret context is already masked in the env dump above.
          # add-mask still covers any later plain echo of the ARN in this step.
          # Do not fetch an Actions variable to fill a missing secret. GITHUB_TOKEN
          # cannot read variables, and a variable value would show up in this env block.
          echo "::add-mask::${AWS_DEPLOY_ROLE_ARN}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${INPUT_ENVIRONMENT}"
            SHA="${GITHUB_SHA}"
          else
            ENVIRONMENT="dev"
            # See commits that landed after this workflow_run was queued.
            # checkout's fetch-depth: 0 does not include them: its ref is github.sha.
            # GitHub git smart HTTP does not accept a Bearer scheme for GITHUB_TOKEN
            # and then prompts for a username (exit 128 with no TTY). Match
            # actions/checkout: Basic x-access-token, base64, no line wrap.
            # GITHUB_TOKEN is masked; the base64 form is a different string, so mask
            # that too. Do not enable xtrace. The header lives only on this command.
            # '+' accepts a force-push. The plan then refuses a SHA that is no longer on main.
            if [ -z "${GITHUB_TOKEN}" ]; then
              echo "GITHUB_TOKEN is empty. Refusing to fetch origin/main."
              exit 1
            fi
            GIT_AUTH_B64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            echo "::add-mask::${GIT_AUTH_B64}"
            git -c "http.extraheader=AUTHORIZATION: basic ${GIT_AUTH_B64}" \
              fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            unset GIT_AUTH_B64
            LAST_ARGS=()
            # A failed or empty lookup deploys. Missing history must not skip the tree CI tested.
            if LAST_DEPLOYED="$(node scripts/last-deployed.mjs)"; then
              if [[ "${LAST_DEPLOYED}" =~ ^[0-9a-f]{40}$ ]]; then
                LAST_ARGS=(--last-deployed-sha "${LAST_DEPLOYED}")
              else
                echo "No successful dev deployment is recorded. Deploying the tested tree."
              fi
            else
              echo "Could not read the last successful dev deployment. Deploying the tested tree."
            fi
            CI_FILE="${RUNNER_TEMP}/newer-ci-conclusions.json"
            CI_FILE_ARGS=()
            # A failed lookup leaves every newer CI unknown. Unknown does not skip the tested SHA.
            if node scripts/ci-conclusions.mjs --head-sha "${HEAD_SHA}" --repo "${GITHUB_WORKSPACE}" --tip origin/main > "${CI_FILE}"; then
              CI_FILE_ARGS=(--ci-conclusions-file "${CI_FILE}")
            else
              echo "Could not read CI results for newer commits. Deploying the tested tree unless a newer application commit is already on dev."
            fi
            PLAN_JSON="$(node scripts/auto-deploy-plan.mjs --head-sha "${HEAD_SHA}" --repo "${GITHUB_WORKSPACE}" --tip origin/main "${LAST_ARGS[@]}" "${CI_FILE_ARGS[@]}")" \
              || { echo "Could not plan the automatic deploy."; exit 1; }
            echo "Auto-deploy plan: ${PLAN_JSON}"
            DEPLOY="$(node -e 'const plan=JSON.parse(process.argv[1]); if(plan.deploy!==true&&plan.deploy!==false) process.exit(2); if(plan.deploy&&!/^[0-9a-f]{40}$/.test(plan.sha)) process.exit(2); process.stdout.write(plan.deploy?"true":"false")' "${PLAN_JSON}")" \
              || { echo "Could not read the auto-deploy plan."; exit 1; }
            if [ "${DEPLOY}" != "true" ]; then
              skip "Automatic dev deploy skipped. ${PLAN_JSON}"
            fi
            SHA="$(node -e 'const plan=JSON.parse(process.argv[1]); if(!/^[0-9a-f]{40}$/.test(plan.sha)) process.exit(2); process.stdout.write(plan.sha)' "${PLAN_JSON}")" \
              || { echo "Could not read the deploy SHA."; exit 1; }
          fi

          case "${ENVIRONMENT}" in
            dev|staging|prod) ;;
            *)
              echo "Unsupported environment."
              exit 1
              ;;
          esac
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ "${ENVIRONMENT}" != "dev" ]; then
            echo "Automatic deploy is limited to dev."
            exit 1
          fi
          if ! [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing to deploy: commit SHA is not 40 lowercase hex characters."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "OIDC deploy role is configured. The role ARN is masked. Environment: ${ENVIRONMENT}."

  build:
    name: sam build (no AWS credentials)
    needs: gate
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SAM_CLI_TELEMETRY: "0"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
    steps:
      - name: Reject long-lived AWS keys
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "Build must not start with AWS credential environment variables."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: sam build
        working-directory: infra
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "sam build must not see AWS credentials."
            exit 1
          fi
          sam build --template template.yaml

      - name: Pack SAM build (preserve bootstrap executable bit)
        run: |
          set -euo pipefail
          # upload-artifact zip restores files as 0644 and drops the executable bit.
          # provided.al2023 requires bootstrap to be executable (Runtime.InvalidEntrypoint otherwise).
          tar -C infra -czf /tmp/sam-build.tar.gz .aws-sam
          # Do not pipe tar into grep -q. grep -q exits on the first match and closes
          # the pipe; GNU tar then exits 2 with "stdout: write error", and pipefail
          # fails the step even when the archive contains bootstrap.
          tar -tvzf /tmp/sam-build.tar.gz > /tmp/sam-build.list
          # Owner execute bit is the 4th mode character. Require a regular file so a
          # directory named bootstrap cannot satisfy the check.
          if ! grep -E -q -- '^-..x.*build/ApiFunction/bootstrap$' /tmp/sam-build.list; then
            echo "bootstrap is missing from the SAM archive or is not executable."
            grep 'ApiFunction' /tmp/sam-build.list || true
            exit 1
          fi

      - name: Upload SAM build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-build
          path: /tmp/sam-build.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy-stack:
    name: sam deploy
    needs: [gate, build]
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      SAM_CLI_TELEMETRY: "0"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      AWS_REGION: ap-northeast-1
      AWS_DEFAULT_REGION: ap-northeast-1
    steps:
      - name: Reject long-lived AWS keys
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "This job started with AWS credential environment variables. OIDC does not use long-lived keys."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Download SAM build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sam-build
          path: /tmp

      - name: Unpack SAM build
        run: |
          set -euo pipefail
          tar -C infra -xzf /tmp/sam-build.tar.gz
          if [ ! -x infra/.aws-sam/build/ApiFunction/bootstrap ]; then
            echo "bootstrap is missing or not executable after unpack. Refusing to deploy."
            ls -la infra/.aws-sam/build/ApiFunction/ || true
            exit 1
          fi

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: gha-kintore-memo-deploy
          mask-aws-account-id: true
          output-credentials: false
          output-env-credentials: true

      - name: sam deploy
        working-directory: infra
        env:
          ENVIRONMENT: ${{ needs.gate.outputs.environment }}
          # Python block-buffers stdout when piped. This keeps progress lines moving.
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ "${ENVIRONMENT}" != "dev" ]; then
            echo "Automatic deploy is limited to dev."
            exit 1
          fi
          case "${ENVIRONMENT}" in
            dev|staging|prod) ;;
            *)
              echo "Unsupported environment."
              exit 1
              ;;
          esac
          STACK="kintore-memo-${ENVIRONMENT}"
          trim() { printf '%s' "$1" | tr -d '\r\n'; }
          read_output() {
            aws cloudformation describe-stacks \
              --region ap-northeast-1 \
              --stack-name "${STACK}" \
              --query "Stacks[0].Outputs[?OutputKey=='${1}'].OutputValue" \
              --output text
          }
          # describe-stacks stdout is captured. Do not echo the domain or the API id.
          STATUS_FILE="$(mktemp)"
          ERR_FILE="$(mktemp)"
          if aws cloudformation describe-stacks \
            --region ap-northeast-1 \
            --stack-name "${STACK}" \
            --query "Stacks[0].StackStatus" \
            --output text >"${STATUS_FILE}" 2>"${ERR_FILE}"; then
            STACK_STATUS="$(tr -d '[:space:]' <"${STATUS_FILE}")"
          else
            if grep -q "does not exist" "${ERR_FILE}"; then
              STACK_STATUS="ABSENT"
            else
              echo "Could not read stack status."
              rm -f "${STATUS_FILE}" "${ERR_FILE}"
              exit 1
            fi
          fi
          rm -f "${STATUS_FILE}" "${ERR_FILE}"
          mask_value() {
            if [ -n "$1" ] && [ "$1" != "None" ]; then
              echo "::add-mask::${1}"
            fi
          }
          mask_api() {
            local api_url api_id
            api_url="$(trim "$(read_output HttpApiUrl 2>/dev/null || true)")"
            api_url="${api_url%/}"
            if [ -z "${api_url}" ] || [ "${api_url}" = "None" ]; then
              return 0
            fi
            mask_value "${api_url}"
            api_id="${api_url#https://}"
            api_id="${api_id%%.*}"
            mask_value "${api_id}"
          }
          load_origin_plan() {
            PHASE="$1" OUT_PATH=/tmp/spa-origin.env \
              STACK_STATUS="${STACK_STATUS}" SPA_DOMAIN="${SPA_DOMAIN}" PREVIOUS_ORIGIN="${SPA_ALLOWED_ORIGIN}" \
              node "${GITHUB_WORKSPACE}/scripts/spa-origin-plan.mjs"
            # shellcheck disable=SC1091
            source /tmp/spa-origin.env
            rm -f /tmp/spa-origin.env
          }
          SPA_ALLOWED_ORIGIN=""
          SPA_DOMAIN=""
          if [ "${STACK_STATUS}" != "ABSENT" ]; then
            SPA_DOMAIN="$(trim "$(read_output CloudFrontDomainName 2>/dev/null || true)")"
            mask_value "${SPA_DOMAIN}"
            if [ -n "${SPA_DOMAIN}" ] && [ "${SPA_DOMAIN}" != "None" ]; then
              mask_value "https://${SPA_DOMAIN}"
            fi
            mask_api
          fi
          load_origin_plan before
          # Drop the stack Outputs table. pipefail still fails the step when sam fails.
          # Progress and error lines stay. Values are read later with describe-stacks.
          deploy_stack() {
            local -a overrides
            overrides=(
              "ProjectName=kintore-memo"
              "Environment=${ENVIRONMENT}"
              "LogRetentionDays=14"
            )
            if [ -n "${SPA_ALLOWED_ORIGIN}" ]; then
              overrides+=("SpaAllowedOrigin=${SPA_ALLOWED_ORIGIN}")
            fi
            sam deploy \
              --template-file .aws-sam/build/template.yaml \
              --region ap-northeast-1 \
              --stack-name "${STACK}" \
              --resolve-s3 \
              --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
              --no-confirm-changeset \
              --no-fail-on-empty-changeset \
              --parameter-overrides "${overrides[@]}" \
              2>&1 | node "${GITHUB_WORKSPACE}/scripts/filter-sam-deploy-log.mjs"
          }
          deploy_stack
          SPA_DOMAIN="$(trim "$(read_output CloudFrontDomainName)")"
          mask_value "${SPA_DOMAIN}"
          if [ -n "${SPA_DOMAIN}" ] && [ "${SPA_DOMAIN}" != "None" ]; then
            mask_value "https://${SPA_DOMAIN}"
          fi
          mask_api
          load_origin_plan after
          if [ "${SPA_ORIGIN_AGAIN}" = "1" ]; then
            deploy_stack
          fi
          echo "sam deploy finished for kintore-memo-${ENVIRONMENT}."

      - name: Export public stack outputs for SPA build
        env:
          ENVIRONMENT: ${{ needs.gate.outputs.environment }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ "${ENVIRONMENT}" != "dev" ]; then
            echo "Automatic deploy is limited to dev."
            exit 1
          fi
          case "${ENVIRONMENT}" in
            dev|staging|prod) ;;
            *)
              echo "Unsupported environment."
              exit 1
              ;;
          esac
          STACK="kintore-memo-${ENVIRONMENT}"
          read_output() {
            aws cloudformation describe-stacks \
              --region ap-northeast-1 \
              --stack-name "${STACK}" \
              --query "Stacks[0].Outputs[?OutputKey=='${1}'].OutputValue" \
              --output text
          }
          USER_POOL_ID="$(read_output UserPoolId)"
          CLIENT_ID="$(read_output UserPoolClientId)"
          API_URL="$(read_output HttpApiUrl)"
          API_URL="${API_URL%/}"
          SPA_BUCKET="$(read_output SpaBucketName)"
          DIST_ID="$(read_output CloudFrontDistributionId)"
          # describe-stacks stdout is captured above and is not echoed.
          # Mask before later commands so a CLI error cannot print the ids.
          if [ -n "${USER_POOL_ID}" ]; then echo "::add-mask::${USER_POOL_ID}"; fi
          if [ -n "${CLIENT_ID}" ]; then echo "::add-mask::${CLIENT_ID}"; fi
          if [ -n "${API_URL}" ]; then echo "::add-mask::${API_URL}"; fi
          if [ -n "${SPA_BUCKET}" ]; then echo "::add-mask::${SPA_BUCKET}"; fi
          if [ -n "${DIST_ID}" ]; then echo "::add-mask::${DIST_ID}"; fi
          if ! [[ "${USER_POOL_ID}" =~ ^ap-northeast-1_[A-Za-z0-9]+$ ]]; then
            echo "Refusing to continue: UserPoolId did not match the Cognito pool id pattern."
            exit 1
          fi
          if ! [[ "${CLIENT_ID}" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "Refusing to continue: UserPoolClientId did not match the app client id pattern."
            exit 1
          fi
          if ! [[ "${API_URL}" =~ ^https://[a-z0-9]+\.execute-api\.ap-northeast-1\.amazonaws\.com/${ENVIRONMENT}$ ]]; then
            echo "Refusing to continue: HttpApiUrl did not match the HTTP API URL pattern."
            exit 1
          fi
          if ! [[ "${SPA_BUCKET}" =~ ^kintore-memo-${ENVIRONMENT}-spa-[0-9]{12}$ ]]; then
            echo "Refusing to continue: SpaBucketName did not match kintore-memo-${ENVIRONMENT}-spa-<account>."
            exit 1
          fi
          if ! [[ "${DIST_ID}" =~ ^E[A-Z0-9]+$ ]]; then
            echo "Refusing to continue: CloudFront distribution id did not match the expected pattern."
            exit 1
          fi
          mkdir -p /tmp/spa-publish
          # Public Cognito / API / publish targets only. No SSM values.
          {
            echo "VITE_COGNITO_REGION=ap-northeast-1"
            echo "VITE_COGNITO_USER_POOL_ID=${USER_POOL_ID}"
            echo "VITE_COGNITO_CLIENT_ID=${CLIENT_ID}"
            echo "VITE_API_BASE_URL=${API_URL}"
            echo "SPA_BUCKET=${SPA_BUCKET}"
            echo "CLOUDFRONT_DISTRIBUTION_ID=${DIST_ID}"
            echo "ENVIRONMENT=${ENVIRONMENT}"
          } > /tmp/spa-publish/env.txt

      - name: Upload SPA publish inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spa-publish-env
          path: /tmp/spa-publish/env.txt
          if-no-files-found: error
          retention-days: 1

  build-spa:
    name: Build SPA (no AWS credentials)
    needs: [gate, deploy-stack]
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Reject long-lived AWS keys
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "SPA build must not start with AWS credential environment variables."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Download SPA publish inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spa-publish-env
          path: /tmp/spa-publish

      - name: Build SPA from public stack outputs
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "npm build must not see AWS credentials."
            exit 1
          fi
          set -a
          # shellcheck disable=SC1091
          source /tmp/spa-publish/env.txt
          set +a
          if [ -n "${VITE_COGNITO_USER_POOL_ID:-}" ]; then echo "::add-mask::${VITE_COGNITO_USER_POOL_ID}"; fi
          if [ -n "${VITE_COGNITO_CLIENT_ID:-}" ]; then echo "::add-mask::${VITE_COGNITO_CLIENT_ID}"; fi
          if [ -n "${VITE_API_BASE_URL:-}" ]; then echo "::add-mask::${VITE_API_BASE_URL}"; fi
          if [ -n "${SPA_BUCKET:-}" ]; then echo "::add-mask::${SPA_BUCKET}"; fi
          if [ -n "${CLOUDFRONT_DISTRIBUTION_ID:-}" ]; then echo "::add-mask::${CLOUDFRONT_DISTRIBUTION_ID}"; fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ "${ENVIRONMENT}" != "dev" ]; then
            echo "Automatic deploy is limited to dev."
            exit 1
          fi
          case "${ENVIRONMENT}" in
            dev|staging|prod) ;;
            *)
              echo "Unsupported environment."
              exit 1
              ;;
          esac
          if ! [[ "${VITE_COGNITO_USER_POOL_ID}" =~ ^ap-northeast-1_[A-Za-z0-9]+$ ]]; then
            echo "Refusing to build: UserPoolId did not match the Cognito pool id pattern."
            exit 1
          fi
          if ! [[ "${VITE_COGNITO_CLIENT_ID}" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "Refusing to build: UserPoolClientId did not match the app client id pattern."
            exit 1
          fi
          if ! [[ "${VITE_API_BASE_URL}" =~ ^https://[a-z0-9]+\.execute-api\.ap-northeast-1\.amazonaws\.com/${ENVIRONMENT}$ ]]; then
            echo "Refusing to build: HttpApiUrl did not match the HTTP API URL pattern."
            exit 1
          fi
          npm ci
          npm run build
          npm run check:secrets
          if ! grep -R -q -F -- "${VITE_COGNITO_USER_POOL_ID}" dist/ \
            || ! grep -R -q -F -- "${VITE_COGNITO_CLIENT_ID}" dist/ \
            || ! grep -R -q -F -- "${VITE_API_BASE_URL}" dist/; then
            echo "Build output is missing the public Cognito or API settings. Refusing to publish."
            exit 1
          fi
          echo "SPA build embedded the public Cognito and API settings for ${ENVIRONMENT}."

      - name: Upload SPA dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spa-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-spa:
    name: Publish SPA to S3 and invalidate CloudFront
    needs: [gate, build-spa]
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      AWS_REGION: ap-northeast-1
      AWS_DEFAULT_REGION: ap-northeast-1
    steps:
      - name: Reject long-lived AWS keys
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "This job started with AWS credential environment variables. OIDC does not use long-lived keys."
            exit 1
          fi

      - name: Download SPA publish inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spa-publish-env
          path: /tmp/spa-publish

      - name: Download SPA dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spa-dist
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: gha-kintore-memo-publish
          mask-aws-account-id: true
          output-credentials: false
          output-env-credentials: true

      - name: Publish SPA
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source /tmp/spa-publish/env.txt
          set +a
          if [ -n "${VITE_COGNITO_USER_POOL_ID:-}" ]; then echo "::add-mask::${VITE_COGNITO_USER_POOL_ID}"; fi
          if [ -n "${VITE_COGNITO_CLIENT_ID:-}" ]; then echo "::add-mask::${VITE_COGNITO_CLIENT_ID}"; fi
          if [ -n "${VITE_API_BASE_URL:-}" ]; then echo "::add-mask::${VITE_API_BASE_URL}"; fi
          if [ -n "${SPA_BUCKET:-}" ]; then echo "::add-mask::${SPA_BUCKET}"; fi
          if [ -n "${CLOUDFRONT_DISTRIBUTION_ID:-}" ]; then echo "::add-mask::${CLOUDFRONT_DISTRIBUTION_ID}"; fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ "${ENVIRONMENT}" != "dev" ]; then
            echo "Automatic deploy is limited to dev."
            exit 1
          fi
          case "${ENVIRONMENT}" in
            dev|staging|prod) ;;
            *)
              echo "Unsupported environment."
              exit 1
              ;;
          esac
          if ! [[ "${SPA_BUCKET}" =~ ^kintore-memo-${ENVIRONMENT}-spa-[0-9]{12}$ ]]; then
            echo "Refusing to sync: SpaBucketName did not match kintore-memo-${ENVIRONMENT}-spa-<account>."
            exit 1
          fi
          if ! [[ "${CLOUDFRONT_DISTRIBUTION_ID}" =~ ^E[A-Z0-9]+$ ]]; then
            echo "Refusing to invalidate: CloudFront distribution id did not match the expected pattern."
            exit 1
          fi
          aws s3 sync dist/ "s3://${SPA_BUCKET}/" --delete --only-show-errors --region ap-northeast-1
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)"
          echo "SPA synced. CloudFront invalidation: ${INVALIDATION_ID}"

  record-dev-deployment:
    name: Record successful dev deployment
    needs: [gate, publish-spa]
    if: success() && needs.gate.outputs.configured == 'true' && needs.gate.outputs.environment == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Reject long-lived AWS keys
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "Recording a GitHub deployment must not see AWS credentials."
            exit 1
          fi

      - name: Checkout the dev deployment recorder
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record the successful dev deployment
        env:
          DEPLOYED_SHA: ${{ needs.gate.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/last-deployed.mjs --record "${DEPLOYED_SHA}"
