# Manual OIDC deploy. No long-lived AWS access keys.
# No-op (success) when the repository variable AWS_DEPLOY_ROLE_ARN is unset.
# Do not add AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY.
# Do not use `set -x`, `sam deploy --debug`, or `aws --debug` — they can print credentials.
# This workflow does not read SSM parameters.
#
# Build (sam build / npm ci / npm run build) runs in jobs without AWS credentials or
# id-token: write. Only deploy-stack and publish-spa assume the OIDC role.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: SAM environment
        type: choice
        required: true
        default: dev
        options:
          - dev
          - staging
          - prod

# Job-level permissions only. Build jobs must not receive id-token: write.
permissions: {}

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  gate:
    name: Check deploy role configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.gate.outputs.configured }}
    steps:
      - name: Skip until the OIDC role exists
        id: gate
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_DEPLOY_ROLE_ARN}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS_DEPLOY_ROLE_ARN is unset. Deploy is a no-op until the OIDC role exists."
            echo "See docs/github-actions-oidc.md."
            exit 0
          fi
          if ! [[ "${AWS_DEPLOY_ROLE_ARN}" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+$ ]]; then
            echo "AWS_DEPLOY_ROLE_ARN is set but is not an IAM role ARN. Not assuming it."
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "This workflow only assumes the deploy role from refs/heads/main."
            exit 1
          fi
          # Mask after the shape check so the ARN is not printed by later steps.
          echo "::add-mask::${AWS_DEPLOY_ROLE_ARN}"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "OIDC deploy role is configured. The role ARN is masked."

  build:
    name: sam build (no AWS credentials)
    needs: gate
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SAM_CLI_TELEMETRY: "0"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
    steps:
      - name: Reject long-lived AWS keys
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "Build must not start with AWS credential environment variables."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: sam build
        working-directory: infra
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "sam build must not see AWS credentials."
            exit 1
          fi
          sam build --template template.yaml

      - name: Pack SAM build (preserve bootstrap executable bit)
        run: |
          set -euo pipefail
          # upload-artifact zip restores files as 0644 and drops the executable bit.
          # provided.al2023 requires bootstrap to be executable (Runtime.InvalidEntrypoint otherwise).
          tar -C infra -czf /tmp/sam-build.tar.gz .aws-sam
          # Do not pipe tar into grep -q. grep -q exits on the first match and closes
          # the pipe; GNU tar then exits 2 with "stdout: write error", and pipefail
          # fails the step even when the archive contains bootstrap.
          tar -tvzf /tmp/sam-build.tar.gz > /tmp/sam-build.list
          # Owner execute bit is the 4th mode character. Require a regular file so a
          # directory named bootstrap cannot satisfy the check.
          if ! grep -E -q -- '^-..x.*build/ApiFunction/bootstrap$' /tmp/sam-build.list; then
            echo "bootstrap is missing from the SAM archive or is not executable."
            grep 'ApiFunction' /tmp/sam-build.list || true
            exit 1
          fi

      - name: Upload SAM build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-build
          path: /tmp/sam-build.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy-stack:
    name: sam deploy
    needs: [gate, build]
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      SAM_CLI_TELEMETRY: "0"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      AWS_REGION: ap-northeast-1
      AWS_DEFAULT_REGION: ap-northeast-1
    steps:
      - name: Reject long-lived AWS keys
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "This job started with AWS credential environment variables. OIDC does not use long-lived keys."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download SAM build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sam-build
          path: /tmp

      - name: Unpack SAM build
        run: |
          set -euo pipefail
          tar -C infra -xzf /tmp/sam-build.tar.gz
          if [ ! -x infra/.aws-sam/build/ApiFunction/bootstrap ]; then
            echo "bootstrap is missing or not executable after unpack. Refusing to deploy."
            ls -la infra/.aws-sam/build/ApiFunction/ || true
            exit 1
          fi

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: gha-kintore-memo-deploy
          mask-aws-account-id: true
          output-credentials: false
          output-env-credentials: true

      - name: sam deploy
        working-directory: infra
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "${ENVIRONMENT}" in
            dev|staging|prod) ;;
            *)
              echo "Unsupported environment."
              exit 1
              ;;
          esac
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --region ap-northeast-1 \
            --stack-name "kintore-memo-${ENVIRONMENT}" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "ProjectName=kintore-memo" "Environment=${ENVIRONMENT}" "LogRetentionDays=14"
          echo "sam deploy finished for kintore-memo-${ENVIRONMENT}."

      - name: Export public stack outputs for SPA build
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "${ENVIRONMENT}" in
            dev|staging|prod) ;;
            *)
              echo "Unsupported environment."
              exit 1
              ;;
          esac
          STACK="kintore-memo-${ENVIRONMENT}"
          read_output() {
            aws cloudformation describe-stacks \
              --region ap-northeast-1 \
              --stack-name "${STACK}" \
              --query "Stacks[0].Outputs[?OutputKey=='${1}'].OutputValue" \
              --output text
          }
          USER_POOL_ID="$(read_output UserPoolId)"
          CLIENT_ID="$(read_output UserPoolClientId)"
          API_URL="$(read_output HttpApiUrl)"
          API_URL="${API_URL%/}"
          SPA_BUCKET="$(read_output SpaBucketName)"
          DIST_ID="$(read_output CloudFrontDistributionId)"
          if ! [[ "${USER_POOL_ID}" =~ ^ap-northeast-1_[A-Za-z0-9]+$ ]]; then
            echo "Refusing to continue: UserPoolId did not match the Cognito pool id pattern."
            exit 1
          fi
          if ! [[ "${CLIENT_ID}" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "Refusing to continue: UserPoolClientId did not match the app client id pattern."
            exit 1
          fi
          if ! [[ "${API_URL}" =~ ^https://[a-z0-9]+\.execute-api\.ap-northeast-1\.amazonaws\.com/${ENVIRONMENT}$ ]]; then
            echo "Refusing to continue: HttpApiUrl did not match the HTTP API URL pattern."
            exit 1
          fi
          if ! [[ "${SPA_BUCKET}" =~ ^kintore-memo-${ENVIRONMENT}-spa-[0-9]{12}$ ]]; then
            echo "Refusing to continue: SpaBucketName did not match kintore-memo-${ENVIRONMENT}-spa-<account>."
            exit 1
          fi
          if ! [[ "${DIST_ID}" =~ ^E[A-Z0-9]+$ ]]; then
            echo "Refusing to continue: CloudFront distribution id did not match the expected pattern."
            exit 1
          fi
          mkdir -p /tmp/spa-publish
          # Public Cognito / API / publish targets only. No SSM values.
          {
            echo "VITE_COGNITO_REGION=ap-northeast-1"
            echo "VITE_COGNITO_USER_POOL_ID=${USER_POOL_ID}"
            echo "VITE_COGNITO_CLIENT_ID=${CLIENT_ID}"
            echo "VITE_API_BASE_URL=${API_URL}"
            echo "SPA_BUCKET=${SPA_BUCKET}"
            echo "CLOUDFRONT_DISTRIBUTION_ID=${DIST_ID}"
            echo "ENVIRONMENT=${ENVIRONMENT}"
          } > /tmp/spa-publish/env.txt

      - name: Upload SPA publish inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spa-publish-env
          path: /tmp/spa-publish/env.txt
          if-no-files-found: error
          retention-days: 1

  build-spa:
    name: Build SPA (no AWS credentials)
    needs: [gate, deploy-stack]
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Reject long-lived AWS keys
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "SPA build must not start with AWS credential environment variables."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Download SPA publish inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spa-publish-env
          path: /tmp/spa-publish

      - name: Build SPA from public stack outputs
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "npm build must not see AWS credentials."
            exit 1
          fi
          set -a
          # shellcheck disable=SC1091
          source /tmp/spa-publish/env.txt
          set +a
          case "${ENVIRONMENT}" in
            dev|staging|prod) ;;
            *)
              echo "Unsupported environment."
              exit 1
              ;;
          esac
          if ! [[ "${VITE_COGNITO_USER_POOL_ID}" =~ ^ap-northeast-1_[A-Za-z0-9]+$ ]]; then
            echo "Refusing to build: UserPoolId did not match the Cognito pool id pattern."
            exit 1
          fi
          if ! [[ "${VITE_COGNITO_CLIENT_ID}" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "Refusing to build: UserPoolClientId did not match the app client id pattern."
            exit 1
          fi
          if ! [[ "${VITE_API_BASE_URL}" =~ ^https://[a-z0-9]+\.execute-api\.ap-northeast-1\.amazonaws\.com/${ENVIRONMENT}$ ]]; then
            echo "Refusing to build: HttpApiUrl did not match the HTTP API URL pattern."
            exit 1
          fi
          npm ci
          npm run build
          npm run check:secrets
          if ! grep -R -q -F -- "${VITE_COGNITO_USER_POOL_ID}" dist/ \
            || ! grep -R -q -F -- "${VITE_COGNITO_CLIENT_ID}" dist/ \
            || ! grep -R -q -F -- "${VITE_API_BASE_URL}" dist/; then
            echo "Build output is missing the public Cognito or API settings. Refusing to publish."
            exit 1
          fi
          echo "SPA build embedded the public Cognito and API settings for ${ENVIRONMENT}."

      - name: Upload SPA dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spa-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-spa:
    name: Publish SPA to S3 and invalidate CloudFront
    needs: [gate, build-spa]
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      AWS_REGION: ap-northeast-1
      AWS_DEFAULT_REGION: ap-northeast-1
    steps:
      - name: Reject long-lived AWS keys
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "This job started with AWS credential environment variables. OIDC does not use long-lived keys."
            exit 1
          fi

      - name: Download SPA publish inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spa-publish-env
          path: /tmp/spa-publish

      - name: Download SPA dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spa-dist
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: gha-kintore-memo-publish
          mask-aws-account-id: true
          output-credentials: false
          output-env-credentials: true

      - name: Publish SPA
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source /tmp/spa-publish/env.txt
          set +a
          case "${ENVIRONMENT}" in
            dev|staging|prod) ;;
            *)
              echo "Unsupported environment."
              exit 1
              ;;
          esac
          if ! [[ "${SPA_BUCKET}" =~ ^kintore-memo-${ENVIRONMENT}-spa-[0-9]{12}$ ]]; then
            echo "Refusing to sync: SpaBucketName did not match kintore-memo-${ENVIRONMENT}-spa-<account>."
            exit 1
          fi
          if ! [[ "${CLOUDFRONT_DISTRIBUTION_ID}" =~ ^E[A-Z0-9]+$ ]]; then
            echo "Refusing to invalidate: CloudFront distribution id did not match the expected pattern."
            exit 1
          fi
          aws s3 sync dist/ "s3://${SPA_BUCKET}/" --delete --only-show-errors --region ap-northeast-1
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)"
          echo "SPA synced. CloudFront invalidation: ${INVALIDATION_ID}"
